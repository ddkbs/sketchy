<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketchy</title>
    <style>
      /* A page of its own: light paper around the drawing, also in dark mode.
         :root outranks the viewer's base styles, which keep the page transparent. */
      :root,
      :root body {
        background: #f1eee6;
      }
      :root body {
        min-height: 100vh;
        padding: 24px;
      }
      #app {
        max-width: 1200px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="application/json" id="sketchy-scene">
      null
    </script>
    <script type="module" src="./src/standalone.ts"></script>
  </body>
</html>
