name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack
      # jsDelivr serves the cdn branch; chat widgets load the bundle from there.
      - if: matrix.os == 'ubuntu-latest'
        name: Publish the browser bundle to the cdn branch
        run: |
          npm run build:web
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          git fetch --depth 1 origin cdn
          git worktree add ../cdn FETCH_HEAD
          # The exact version stays put; the minor folder is what skills load.
          for dir in "$version" "$minor"; do
            mkdir -p "../cdn/$dir"
            cp build/web/sketchy.js build/parts.json "../cdn/$dir/"
          done
          cd ../cdn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cdn): publish $version"
          git push origin HEAD:cdn
          # The pinned skill loads from this commit.
          echo "SKETCHY_PIN_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # jsDelivr caches files for days; refresh the overwritten ones.
          for file in sketchy.js parts.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/ddkbs/sketchy@cdn/$minor/$file" > /dev/null || true
          done
      # The skill is platform independent, so one runner builds it.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run build:skill
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.mcpb
            sketchy-skill-*.zip
          draft: true
