name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack
      # The skill is platform independent, so one runner builds it.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run build:skill
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.mcpb
            sketchy-skill-*.zip
          draft: true
