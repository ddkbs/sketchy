name: Publish to npm

# Releases start as drafts; the package follows once a release is published.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Trusted publishing: npm verifies this workflow instead of a stored token.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5 or newer.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish unless this version is already on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public
          fi
